name: Bug Report
description: Report a bug or unexpected behavior in Orbit Desktop
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, please search [existing issues](../issues) to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Orbit Desktop
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Orbit Desktop version
      placeholder: "0.x.x"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Windows x86_64
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
