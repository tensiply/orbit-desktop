name: Feature Request
description: Suggest a new feature or improvement for Orbit Desktop
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [existing issues and discussions](../issues) before submitting.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
