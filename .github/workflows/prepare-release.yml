name: Prepare Release

# ── Usage ──────────────────────────────────────────────────────────────────────
# 1. Actions → Prepare Release → Run workflow → enter version (X.Y.Z)
# 2. "CI" gate runs — frontend, fmt, clippy, tests, security audit.
# 3. "Preview" shows the CHANGELOG diff and a pre-flight summary.
# 4. "Release" job waits for manual approval (Environment: release).
# 5. Review the summary → "Review pending deployments" → Approve.
# 6. Commit + tag are pushed, triggering release.yml automatically.
#
# One-time setup: Settings → Environments → "release" → Required reviewers → add yourself

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release (unsigned macOS builds)"
        required: false
        type: boolean
        default: true
      orbit_cli_version:
        description: "orbit CLI to bundle (e.g. v0.21.0). Leave empty to pin the latest orbit release."
        required: false
        type: string
        default: ""

jobs:
  # ── Job 1: CI gate ────────────────────────────────────────────────────────────
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Job 2: validate + security gate + show summary ───────────────────────────
  preview:
    name: Preview v${{ inputs.version }}
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION' — must be X.Y.Z (e.g. 0.2.0)"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          FIRST=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{if(f)exit} f&&NF{print;exit}' CHANGELOG.md)
          if [ -z "$FIRST" ]; then
            echo "::error::[Unreleased] section is empty — add changelog entries before releasing"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit — block on critical/high
        # Same policy as release.yml: block on CVEs and unsound advisories.
        # Ignores are transitive deps we cannot fix: GTK3/glib (Tauri), serde_yml/libyml (orbit-core), unic-* / proc-macro-error / serial (indirect).
        run: |
          cargo audit --deny unsound \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0411 \
            --ignore RUSTSEC-2024-0417 \
            --ignore RUSTSEC-2024-0414 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2025-0067 \
            --ignore RUSTSEC-2025-0068 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2017-0008 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2025-0098

      - name: Write summary
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: python3 .github/scripts/preview_release.py

  # ── Job 3: execute release (waits for manual approval) ───────────────────────
  release:
    name: Release v${{ inputs.version }}
    needs: preview
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve orbit CLI version to bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ inputs.orbit_cli_version }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            VER="$OVERRIDE"
          else
            VER=$(gh api repos/${{ github.repository_owner }}/orbit/releases/latest -q .tag_name)
          fi
          if [ -z "$VER" ]; then
            echo "::error::could not resolve orbit CLI version to bundle"
            exit 1
          fi
          echo "ORBIT_CLI_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Bundling orbit CLI $VER"

      - name: Bump versions and update CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
        run: |
          export TODAY=$(date -u +%Y-%m-%d)
          python3 .github/scripts/bump_versions.py

      - name: Commit, tag, push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "Eloir Corona"
          git config user.email "eloircoronah@outlook.com"
          git add CHANGELOG.md ui/package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml Cargo.lock ORBIT_CLI_VERSION
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push --atomic origin main "v${VERSION}"

  # ── Job 4: build + publish the release ───────────────────────────────────────
  # The tag pushed above uses GITHUB_TOKEN, which does not trigger release.yml's
  # tag-push event. Call it directly as a reusable workflow instead.
  build-release:
    name: Build release v${{ inputs.version }}
    needs: release
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ inputs.version }}
