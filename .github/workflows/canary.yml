name: Canary

# Every merge to main publishes a canary desktop pre-release. Versioning rule:
# stable ships only as vX.Y.0; every patch vX.Y.Z (Z >= 1) is a canary
# pre-release. The app is branded "Orbit Desktop CANARY" (tauri.canary.conf.json
# + the `canary` cargo feature) and isolates its data under ~/.orbit-canary.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: full CI must pass before we cut a canary ──────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── Compute the next canary version: vX.Y.(highest+1), min .1 ───────────────
  prepare:
    name: Compute canary version
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next canary patch version
        id: ver
        run: |
          MINOR=$(python3 -c "import json;print('.'.join(json.load(open('src-tauri/tauri.conf.json'))['version'].split('.')[:2]))")
          HIGHEST=$(git tag -l "v${MINOR}.*" \
            | sed "s/^v${MINOR}\.//" \
            | grep -E '^[0-9]+$' \
            | sort -n | tail -1)
          NEXT=$(( ${HIGHEST:-0} + 1 ))
          VERSION="${MINOR}.${NEXT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "Next canary: v${VERSION}"

  # ── Build the branded canary bundle ─────────────────────────────────────────
  build:
    name: Build — ${{ matrix.artifact_suffix }}
    needs: prepare
    permissions:
      contents: write
    # Windows is experimental until ORBIT_CLI_VERSION / the canary orbit release
    # publishes a windows-x86_64 sidecar — keep it non-blocking meanwhile.
    continue-on-error: ${{ matrix.experimental || false }}
    # Run all steps under bash so the shell scripting works on the Windows runner.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_suffix: linux
            args: ""
            orbit_slug: linux-x86_64
            sidecar_triple: x86_64-unknown-linux-gnu

          - platform: windows-latest
            artifact_suffix: windows
            args: "-c src-tauri/tauri.windows.conf.json"
            orbit_slug: windows-x86_64
            sidecar_triple: x86_64-pc-windows-msvc
            experimental: true
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp canary version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          v = os.environ["VERSION"]
          for path, key in (("src-tauri/tauri.conf.json", "version"), ("ui/package.json", "version")):
              d = json.load(open(path))
              d[key] = v
              json.dump(d, open(path, "w"), indent=2)
              open(path, "a").write("\n")
          cargo = open("src-tauri/Cargo.toml").read()
          cargo = re.sub(r'^version = ".*"', f'version = "{v}"', cargo, count=1, flags=re.M)
          open("src-tauri/Cargo.toml", "w").write(cargo)
          print("stamped", v)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: canary-${{ matrix.platform }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Generate TypeScript bindings
        run: |
          mkdir -p ui/src/bindings
          TS_RS_EXPORT_DIR=$(pwd)/ui/src/bindings \
            cargo test 'export_' --manifest-path src-tauri/Cargo.toml

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      # The bundled orbit CLI runs as a sidecar. The canary desktop always
      # bundles the latest orbit canary CLI so canary-on-canary testing is exact.
      - name: Fetch bundled orbit CLI (latest canary)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORBIT_VER=$(gh release list --repo tensiply/orbit --limit 50 \
            --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | first | .tagName')
          echo "Latest orbit canary: ${ORBIT_VER}"
          VER="${ORBIT_VER#v}"
          EXT=""; [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          ASSET="orbit-canary-${VER}-${{ matrix.orbit_slug }}${EXT}"
          OUT="src-tauri/binaries/orbit-${{ matrix.sidecar_triple }}${EXT}"
          mkdir -p src-tauri/binaries
          gh release download "${ORBIT_VER}" --repo tensiply/orbit \
            --pattern "${ASSET}" \
            --output "${OUT}"
          [ "${{ runner.os }}" = "Windows" ] || chmod +x "${OUT}"

      - name: Build Tauri canary app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseBody: "Canary pre-release built from main."
          releaseDraft: false
          prerelease: true
          # Canary branding (productName/identifier) + the bundle sidecar +
          # the `canary` cargo feature. tauri.updater.conf.json enables
          # createUpdaterArtifacts; tauri.canary.updater.conf.json overrides the
          # endpoint to the canary-latest tag so in-app updates work.
          args: ${{ matrix.args }} -c src-tauri/tauri.canary.conf.json -c src-tauri/tauri.bundle.conf.json -c src-tauri/tauri.updater.conf.json -c src-tauri/tauri.canary.updater.conf.json --features canary

      # Homologate the tauri bundle names to
      # orbit-desktop-canary-<version>-<arch>.<ext> (amd64 -> x86_64).
      # Also rewrites latest.json URLs to match the renamed assets so
      # the in-app updater resolves the correct download paths.
      - name: Normalize asset filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: canary
        run: |
          mkdir -p artifacts
          gh release download "${TAG}" --dir artifacts --skip-existing || true
          cd artifacts
          for f in *; do
            new=$(python3 "$GITHUB_WORKSPACE/.github/scripts/homologate_asset.py" "$f" "$CHANNEL")
            if [ -n "$new" ] && [ "$f" != "$new" ]; then
              mv "$f" "$new"
              gh release delete-asset "${TAG}" "$f" --yes || true
              gh release upload "${TAG}" "$new" --clobber
              echo "renamed: $f -> $new"
            fi
          done
          if [ -f latest.json ]; then
            CHANNEL="$CHANNEL" python3 - <<'PY'
          import json, os, subprocess, urllib.parse
          script = os.path.join(os.environ["GITHUB_WORKSPACE"], ".github/scripts/homologate_asset.py")
          channel = os.environ["CHANNEL"]
          def homologate(name):
              out = subprocess.run(["python3", script, name, channel],
                                   capture_output=True, text=True).stdout.strip()
              return out or name
          with open("latest.json") as f:
              manifest = json.load(f)
          for platform in manifest.get("platforms", {}).values():
              if "url" in platform:
                  base, _, fname = platform["url"].rpartition("/")
                  decoded = urllib.parse.unquote(fname)
                  platform["url"] = f"{base}/{homologate(decoded)}"
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY
            gh release upload "${TAG}" latest.json --clobber
            echo "rewrote latest.json urls"
          fi

      # Pin the updated latest.json (with homologated URLs) to the fixed
      # `canary-latest` tag so the in-app updater always finds it at a stable URL.
      - name: Pin latest.json to canary-latest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view canary-latest --repo tensiply/orbit-desktop > /dev/null 2>&1 || \
            gh release create canary-latest \
              --repo tensiply/orbit-desktop \
              --prerelease \
              --title "Canary Latest" \
              --notes "Floating tag — always reflects the latest canary build. Do not modify manually."
          mkdir -p artifacts-updater
          gh release download "${TAG}" \
            --dir artifacts-updater \
            --pattern "latest.json" \
            --clobber
          if [ -f artifacts-updater/latest.json ]; then
            gh release upload canary-latest artifacts-updater/latest.json --clobber
          fi
