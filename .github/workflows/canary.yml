name: Canary

# Every merge to main publishes a canary desktop pre-release. Versioning rule:
# stable ships only as vX.Y.0; every patch vX.Y.Z (Z >= 1) is a canary
# pre-release. The app is branded "Orbit Desktop CANARY" (tauri.canary.conf.json
# + the `canary` cargo feature) and isolates its data under ~/.orbit-canary.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: full CI must pass before we cut a canary ──────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── Compute the next canary version: vX.Y.(highest+1), min .1 ───────────────
  prepare:
    name: Compute canary version
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next canary patch version
        id: ver
        run: |
          MINOR=$(python3 -c "import json;print('.'.join(json.load(open('src-tauri/tauri.conf.json'))['version'].split('.')[:2]))")
          HIGHEST=$(git tag -l "v${MINOR}.*" \
            | sed "s/^v${MINOR}\.//" \
            | grep -E '^[0-9]+$' \
            | sort -n | tail -1)
          NEXT=$(( ${HIGHEST:-0} + 1 ))
          VERSION="${MINOR}.${NEXT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "Next canary: v${VERSION}"

  # ── Build the branded canary bundle ─────────────────────────────────────────
  build:
    name: Build — ${{ matrix.artifact_suffix }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_suffix: linux
            args: ""
            orbit_asset: orbit-linux-x86_64
            sidecar_triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp canary version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          v = os.environ["VERSION"]
          for path, key in (("src-tauri/tauri.conf.json", "version"), ("ui/package.json", "version")):
              d = json.load(open(path))
              d[key] = v
              json.dump(d, open(path, "w"), indent=2)
              open(path, "a").write("\n")
          cargo = open("src-tauri/Cargo.toml").read()
          cargo = re.sub(r'^version = ".*"', f'version = "{v}"', cargo, count=1, flags=re.M)
          open("src-tauri/Cargo.toml", "w").write(cargo)
          print("stamped", v)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: canary-${{ matrix.platform }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Generate TypeScript bindings
        run: |
          mkdir -p ui/src/bindings
          TS_RS_EXPORT_DIR=$(pwd)/ui/src/bindings \
            cargo test 'export_' --manifest-path src-tauri/Cargo.toml

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      # The bundled orbit CLI runs as a sidecar. The canary desktop exports
      # ORBIT_CHANNEL=canary + ORBIT_HOME=~/.orbit-canary, which the spawned CLI
      # inherits — so the pinned CLI behaves as canary and stays isolated.
      - name: Fetch bundled orbit CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORBIT_VER=$(cat ORBIT_CLI_VERSION)
          mkdir -p src-tauri/binaries
          gh release download "${ORBIT_VER}" --repo tensiply/orbit \
            --pattern "${{ matrix.orbit_asset }}" \
            --output "src-tauri/binaries/orbit-${{ matrix.sidecar_triple }}"
          chmod +x "src-tauri/binaries/orbit-${{ matrix.sidecar_triple }}"

      - name: Build Tauri canary app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseBody: "Canary pre-release built from main."
          releaseDraft: false
          prerelease: true
          # Canary branding (productName/identifier) + the bundle sidecar +
          # the `canary` cargo feature. No updater config: canary users pull new
          # pre-releases directly.
          args: ${{ matrix.args }} -c src-tauri/tauri.canary.conf.json -c src-tauri/tauri.bundle.conf.json --features canary
