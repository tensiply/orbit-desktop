name: Release

on:
  push:
    tags:
      # Stable ships only as vX.Y.0. Patch tags (vX.Y.Z, Z>=1) are canary
      # pre-releases handled by canary.yml and must not trigger a full release.
      - "v*.*.0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Verify the tag matches versions in tauri.conf.json and Cargo.toml ─────────
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract and verify versions
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}"         >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          TAURI_VER=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          UI_VER=$(python3 -c "import json; print(json.load(open('ui/package.json'))['version'])")

          FAIL=0
          if [ "${TAURI_VER}" != "${VERSION}" ]; then
            echo "::error::tauri.conf.json has ${TAURI_VER} but tag is ${TAG}"; FAIL=1
          fi
          if [ "${CARGO_VER}" != "${VERSION}" ]; then
            echo "::error::src-tauri/Cargo.toml has ${CARGO_VER} but tag is ${TAG}"; FAIL=1
          fi
          if [ "${UI_VER}" != "${VERSION}" ]; then
            echo "::error::ui/package.json has ${UI_VER} but tag is ${TAG}"; FAIL=1
          fi
          [ $FAIL -eq 0 ] && echo "All versions verified: ${TAG}"
          exit $FAIL

  # ── Security gate: block on critical/high CVEs before building ────────────────
  security:
    name: Security audit
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit — deny vulnerabilities
        # Block on CVEs and unsound advisories.
        # Ignores are transitive deps we cannot fix: GTK3/glib (Tauri), serde_yml/libyml (orbit-core), unic-* / proc-macro-error / serial (indirect).
        run: |
          cargo audit --deny unsound \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0411 \
            --ignore RUSTSEC-2024-0417 \
            --ignore RUSTSEC-2024-0414 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2025-0067 \
            --ignore RUSTSEC-2025-0068 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2017-0008 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2025-0098

  # ── Build Tauri app for all target platforms ──────────────────────────────────
  build:
    name: Build — ${{ matrix.platform }}
    needs: [verify, security]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_suffix: linux
            args: ""
            orbit_slug: linux-x86_64
            sidecar_triple: x86_64-unknown-linux-gnu

          # macOS build temporarily disabled — re-enable when code signing is configured (gap #3)
          # - platform: macos-latest
          #   artifact_suffix: macos
          #   # Universal binary (Intel + Apple Silicon)
          #   args: "--target universal-apple-darwin"
          #   orbit_slug: macos-aarch64   # (universal build needs both arches — revisit)
          #   sidecar_triple: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Generate TypeScript bindings
        run: |
          mkdir -p ui/src/bindings
          TS_RS_EXPORT_DIR=$(pwd)/ui/src/bindings \
            cargo test 'export_' --manifest-path src-tauri/Cargo.toml

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      # Bundle the orbit CLI as a Tauri sidecar so the app is self-contained.
      # The pinned version lives in ORBIT_CLI_VERSION; orbit ships static musl
      # binaries. Tauri expects the sidecar named with the target triple.
      - name: Fetch bundled orbit CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORBIT_VER=$(cat ORBIT_CLI_VERSION)
          ASSET="orbit-stable-${ORBIT_VER#v}-${{ matrix.orbit_slug }}"
          mkdir -p src-tauri/binaries
          gh release download "${ORBIT_VER}" --repo tensiply/orbit \
            --pattern "${ASSET}" \
            --output "src-tauri/binaries/orbit-${{ matrix.sidecar_triple }}"
          chmod +x "src-tauri/binaries/orbit-${{ matrix.sidecar_triple }}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (tauri-plugin-updater). The public key is in
          # tauri.conf.json; these sign the updater artifacts + latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing disabled until Developer ID Certificate is configured (gap #4)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: ${{ needs.verify.outputs.tag }}
          releaseBody: "__Release notes will be updated below.__"
          releaseDraft: true
          prerelease: false
          # Merge the bundle-only config so externalBin (the orbit sidecar) is
          # applied only when bundling — base config stays sidecar-free so plain
          # cargo builds (dev, CI checks) don't require the binary to exist.
          args: ${{ matrix.args }} -c src-tauri/tauri.bundle.conf.json -c src-tauri/tauri.updater.conf.json

  # ── Finalize: add checksums + release notes, publish ─────────────────────────
  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 - <<'EOF'
          import re, os
          v = os.environ["VERSION"]
          with open("CHANGELOG.md") as f:
              cl = f.read()
          m = re.search(
              rf"(?m)^## \[{re.escape(v)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              cl, re.DOTALL
          )
          body = m.group(1).strip() if m else "_No changelog entry found._"
          note = body
          with open("release_notes.md", "w") as f:
              f.write(note + "\n")
          EOF

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${TAG}" --dir artifacts --skip-existing || true

      # Tauri derives artifact filenames from productName ("Orbit Desktop"),
      # yielding "Orbit Desktop_x.y.z_amd64.ext". Homologate to the canonical
      # orbit-desktop-<channel>-<version>-<arch>.<ext> (amd64 -> x86_64).
      - name: Normalize asset filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: stable
        run: |
          cd artifacts
          # Rename installers + updater artifacts (.sig share the prefix).
          for f in *; do
            new=$(python3 "$GITHUB_WORKSPACE/.github/scripts/homologate_asset.py" "$f" "$CHANNEL")
            if [ -n "$new" ] && [ "$f" != "$new" ]; then
              mv "$f" "$new"
              gh release delete-asset "${TAG}" "$f" --yes || true
              gh release upload "${TAG}" "$new" --clobber
              echo "renamed: $f -> $new"
            fi
          done
          # The updater manifest references artifacts by URL and carries a build
          # placeholder for notes — rewrite the URLs to the renamed files and set
          # the real release notes (release_notes.md is written by the step above).
          if [ -f latest.json ]; then
            CHANNEL="$CHANNEL" python3 - <<'PY'
          import json, os, subprocess, urllib.parse
          script = os.path.join(os.environ["GITHUB_WORKSPACE"], ".github/scripts/homologate_asset.py")
          channel = os.environ["CHANNEL"]
          def homologate(name):
              out = subprocess.run(["python3", script, name, channel],
                                   capture_output=True, text=True).stdout.strip()
              return out or name
          with open("latest.json") as f:
              manifest = json.load(f)
          for platform in manifest.get("platforms", {}).values():
              if "url" in platform:
                  base, _, fname = platform["url"].rpartition("/")
                  decoded = urllib.parse.unquote(fname)
                  platform["url"] = f"{base}/{homologate(decoded)}"
          try:
              with open("../release_notes.md") as f:
                  manifest["notes"] = f.read().strip()
          except FileNotFoundError:
              pass
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY
            gh release upload "${TAG}" latest.json --clobber
            echo "rewrote latest.json (urls + notes)"
          fi

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt || true
          cat checksums.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release upload "${TAG}" artifacts/checksums.txt --clobber

      - name: Update release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release edit "${TAG}" \
            --notes-file release_notes.md \
            --draft=false \
            --prerelease=false \
            --title "${TAG}"
