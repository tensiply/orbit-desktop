[package]
name = "orbit-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Eloir Corona"]
license = "MIT"
description = "orbit desktop — terminal emulator + management UI"

[lib]
name = "orbit_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"

portable-pty = "0.8"

orbit-core   = { git = "https://github.com/tensiply/orbit", branch = "main" }
orbit-engine = { git = "https://github.com/tensiply/orbit", branch = "main" }
orbit-client = { git = "https://github.com/tensiply/orbit", branch = "main" }

directories = "6"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
axum = "0.8"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ts-rs = "10"

[features]
dev = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
